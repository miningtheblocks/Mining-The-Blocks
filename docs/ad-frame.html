<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CRIT-22 mitigación v2 (2026-06-17): iframe sandbox aislado.
       Esta página vive dentro de un <iframe sandbox> en adpick.html. El
       sandbox del padre evita que el script del ad-network acceda al DOM
       del padre, al sessionStorage del padre (donde están sid+token) o a
       las cookies del usuario. Por eso acá podemos usar un CSP permisivo
       sin romper la mitigación: el malvertising queda confinado a este
       iframe sin same-origin.
       Nota: no añadimos 'unsafe-eval'; el script del ad-network funciona
       sin eval. Si una red distinta lo requiere, evaluar en su momento. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <title>ad</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body { min-height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
<!-- Ad network script — se ejecuta dentro del sandbox del iframe.
     Si esta red se reemplaza (TODO long-term: AdSense/Coinzilla), cambiar
     este <script src=...> únicamente. La superficie de XSS/malvertising
     queda confinada a este origen aislado. -->
<script src="https://pl29683393.effectivecpmnetwork.com/13/ce/c2/13cec2cd2d7b5f2302ef1e88a79a03f1.js"></script>
</body>
</html>
