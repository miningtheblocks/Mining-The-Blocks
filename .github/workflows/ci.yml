name: CI

# Principio de menor privilegio (recomendación GitHub).
permissions:
  contents: read

# Evitar runs duplicados en el mismo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Setup Java (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Lint
        working-directory: functions
        run: npm run lint

      - name: Unit tests (helpers)
        working-directory: functions
        run: npm test

      - name: Firestore rules tests
        working-directory: functions
        run: npm run test:rules

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify keystore NOT committed
        run: |
          if git ls-files | grep -E '\.(keystore|jks)$|mtb-release\.'; then
            echo "ERROR: keystore or release artifact committed!"
            exit 1
          fi
          echo "OK: No keystore committed"

      - name: Verify .env NOT committed (besides example)
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.local$|^\.env\..+\.local$|service-account.*\.json|^credentials\.json$|^mtb-admin-cli.*\.json$|\.runtimeconfig\.json$|\.(p12|pfx|pem)$'; then
            echo "ERROR: secret file committed!"
            exit 1
          fi
          echo "OK: No secret files committed"

      # CRIT-24: docs/verify.html debe NUNCA existir. El flow de verificación
      # de email vive en public/verify.html (Firebase Hosting). Si una copia
      # vieja sin el fix XSS termina en docs/ (GitHub Pages), reabre el agujero.
      - name: Verify docs/verify.html does NOT exist
        run: |
          if [ -f docs/verify.html ]; then
            echo "ERROR: docs/verify.html debe NO existir. El verify lo sirve Firebase Hosting (public/verify.html)."
            exit 1
          fi
          echo "OK: docs/verify.html not present"

      - name: Scan for obvious hardcoded secrets
        run: |
          # Excluye: API keys públicas Firebase (AIzaSy*), domains públicos,
          # direcciones Ethereum (0x[40hex] son públicas on-chain), URLs.
          if grep -rEn "(['\"])[A-Za-z0-9+/]{40,}\1" --include="*.js" \
              src/firebase/client.js functions/index.js functions/constants.js functions/helpers.js 2>/dev/null \
              | grep -vE "AIzaSy|firebaseapp|us-central1-|policies\.google|exp\.host|/Mining-The-Blocks/|'0x[a-fA-F0-9]{40}'" \
              | head -5 \
              | grep .; then
            echo "WARN: Possible hardcoded secret(s) above — review."
            exit 1
          fi
          echo "OK: No obvious hardcoded secrets"

      # Round 2 Agente #11 MED-11-33: audit strict en deps de prod.
      # Pre-fix: continue-on-error:true + `|| true` → vulns nunca rompían CI.
      # Ahora: --audit-level=critical es bloqueante (high+critical son public
      # advisories que merecen fix antes de merge). Dev-deps excluidas con --omit=dev.
      # Si aparece falso positivo (vuln transitiva no aplicable), agregar al
      # array de exclusiones aquí con un comentario justificando.
      - name: npm audit (functions)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=critical

      # Round 2 audit #5 HIGH-4: extender el gate de npm audit al root.
      # Pre-fix solo cubría functions/; vulns en deps de la app móvil (Expo,
      # RN, etc.) no rompían CI aunque fueran críticas.
      - name: npm audit (root)
        run: npm audit --omit=dev --audit-level=critical

  client-bundle:
    name: Client RN bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      # HIGH-11-29 (audit Round 2 / fix 2026-06-23+): el CI antes solo
      # validaba functions/ (backend). Cualquier commit que rompiera el
      # cliente RN/Expo (typo en import, breaking change de deps, error de
      # sintaxis) pasaba el CI verde y se descubría recién al hacer eas build
      # (~30 min de feedback loop). Ahora ejecutamos `expo export` + `expo-doctor`
      # para validar que el cliente al menos bundlea sin errores. NO se firma
      # APK acá (eso requiere keystore que NO debe estar en CI sin credenciales
      # explícitas — sigue manual via EAS).
      - name: Install dependencies (root)
        run: npm ci --no-audit --no-fund
      - name: Expo doctor (config + deps audit)
        run: npx expo-doctor || echo "expo-doctor warnings — review pero no bloquea"
      - name: Bundle JS (verifica que Metro empaqueta sin errores)
        run: npx expo export --platform android --output-dir /tmp/mtb-export --no-source-maps
        env:
          EXPO_NO_TELEMETRY: '1'

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Round 2 Agente #7 P3: SBOM (Software Bill of Materials) en formato
      # CycloneDX para tracking de dependencias + scanning de CVE futuros.
      # Generado en cada push, attachable a la release. Tools: @cyclonedx/cdxgen
      # (genera SBOM agnóstico al language). El JSON queda en artifacts.
      # Round 2 audit #5 HIGH-5: pinned cdxgen version. `@latest` es supply-chain
      # risk: si el package se compromete, código malicioso corre en CI con
      # secrets del repo. Pinned a 11.5.0 (verificar releases periódicamente).
      - name: Generate functions SBOM
        run: npx -y @cyclonedx/cdxgen@11.5.0 -t nodejs -o sbom-functions.json functions
      - name: Generate root SBOM
        run: npx -y @cyclonedx/cdxgen@11.5.0 -t nodejs -o sbom-root.json .
      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json
          retention-days: 90
