## Mining The Blocks — Sentry CLI configuration.
##
## Round 2 audit #9 HIGH-2: source maps upload pipeline.
##
## Este archivo lo lee `sentry-cli` (binario invocado por el plugin de Expo
## @sentry/react-native durante EAS build) para subir source maps. Sin esto,
## los crashes que llegan a Sentry vienen con stack traces minified/obfuscated
## post-R8 — inactionables.
##
## `defaults.org` y `defaults.project` deben coincidir con app.json plugin.
## `auth.token` se inyecta vía env var SENTRY_AUTH_TOKEN al build (NO se
## hardcodea en este archivo). El archivo está safe para commit; el token NO.

defaults.org=miningtheblocks
defaults.project=mining-the-blocks
defaults.url=https://sentry.io/

## auth.token: leer de env var SENTRY_AUTH_TOKEN.
## NO descomentar este line con un token real — usar EAS secrets en su lugar.
# auth.token=
